name: Ollama compatibility

# Tracks the latest *stable* Ollama release (pre-releases are ignored).
# The version osync is tested against is recorded in .github/ollama-version.
# The daily check takes seconds; the integration suite only runs when Ollama published a new
# release that has not been handled yet:
#   pass -> opens a PR into dev that bumps .github/ollama-version
#   fail -> opens an issue with a link to the failing run (no re-test while that issue is open)
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      latest: ${{ steps.check.outputs.latest }}
      run: ${{ steps.check.outputs.run }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Compare with the tested version
        id: check
        run: |
          tested="$(tr -d '[:space:]' < .github/ollama-version)"
          # releases/latest never returns drafts or pre-releases
          latest="$(gh api repos/ollama/ollama/releases/latest --jq .tag_name)"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Tested: $tested, latest stable: $latest" >> "$GITHUB_STEP_SUMMARY"
          run=false
          if [ "$latest" != "$tested" ]; then
            run=true
            if gh pr list --state open --head "ci/ollama-$latest" --json number --jq '.[0].number' | grep -q .; then
              echo "Bump PR for $latest already open" >> "$GITHUB_STEP_SUMMARY"; run=false
            fi
            if gh issue list --state open --search "\"Ollama $latest\" in:title" --json number --jq '.[0].number' | grep -q .; then
              echo "Open issue for $latest exists; not re-testing" >> "$GITHUB_STEP_SUMMARY"; run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  test:
    needs: check
    if: needs.check.outputs.run == 'true'
    uses: ./.github/workflows/integration.yml
    with:
      ollama-version: ${{ needs.check.outputs.latest }}

  report:
    needs: [check, test]
    if: always() && needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      LATEST: ${{ needs.check.outputs.latest }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dev

      - name: Open bump PR
        if: needs.test.result == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "ci/ollama-$LATEST"
          echo "$LATEST" > .github/ollama-version
          git commit -am "Test against Ollama $LATEST"
          git push -f origin "ci/ollama-$LATEST"
          body="The integration suite passed against Ollama $LATEST: $RUN_URL"
          if ! gh pr create --base dev --head "ci/ollama-$LATEST" --title "Test against Ollama $LATEST" --body "$body"; then
            # Repositories can forbid Actions from creating PRs; fall back to an issue
            gh issue create --title "Ollama $LATEST passes: bump .github/ollama-version" \
              --body "$body. Branch ci/ollama-$LATEST contains the bump."
          fi

      - name: Open failure issue
        if: needs.test.result != 'success'
        run: |
          gh issue create --title "Ollama $LATEST breaks osync integration tests" \
            --body "The integration suite failed against Ollama $LATEST (latest stable release). Run: $RUN_URL"
