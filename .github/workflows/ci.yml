name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  build-unit:
    name: Build + unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore osync.sln

      - name: Build
        run: dotnet build osync.sln -c Release --no-restore

      - name: Unit tests
        run: >
          dotnet test osync.Tests -c Release --no-build
          --filter "FullyQualifiedName~osync.Tests.UnitTests"
          --logger "trx;LogFileName=unit-${{ matrix.os }}.trx"
          --results-directory TestResults

      - name: Smoke-run the built CLI
        shell: bash
        run: |
          dotnet osync/bin/Release/net10.0/osync.dll -v < /dev/null
          dotnet osync/bin/Release/net10.0/osync.dll -h < /dev/null > /dev/null

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: unit-results-${{ matrix.os }}
          path: TestResults/*.trx
          if-no-files-found: ignore
